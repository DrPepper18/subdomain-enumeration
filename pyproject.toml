[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "subdomain-enum"
version = "1.0.0"
description = "CLI-утилита для пассивного поиска поддоменов (subdomain enumeration) с резолвингом IP"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
    "requests>=2.32",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.6",
    "pytest>=8.0",
    "pytest-cov>=5.0",
]

[project.scripts]
subdomain-enum = "main:main"

[tool.setuptools]
package-dir = {"" = "src"}
py-modules = ["interface", "main", "models", "services"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "N", "C4"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["subdomain_enum"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
